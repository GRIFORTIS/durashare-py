[build-system]
requires = ["setuptools>=83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durashare_py"
version = "0.6.0"
description = "durashare_py: BIP39 threshold backup over GF(2053), matching HTML v0.6.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "GRIFORTIS", email = "contact@grifortis.com"}
]
maintainers = [
    {name = "Renato Schiavinato Lopez", email = "renato.lopez@grifortis.com"}
]
keywords = [
    "bip39",
    "shamir",
    "secret-sharing",
    "mnemonic",
    "cryptocurrency",
    "bitcoin",
    "inheritance",
    "backup",
    "durashare_py",
    "gf2053"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.10"
dependencies = [
    "mnemonic>=0.20",  # For BIP39 support
]

[project.optional-dependencies]
dev = [
    # Pinned for deterministic CI and reproducible tooling behavior
    # Keep pins compatible with the lowest supported runtime (Python 3.10)
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "mypy==1.19.1",
    "black>=26.3.1",
    "ruff==0.14.14",
    "isort==7.0.0",
]

[project.urls]
Homepage = "https://github.com/GRIFORTIS/durashare-py"
Documentation = "https://github.com/GRIFORTIS/durashare"
Repository = "https://github.com/GRIFORTIS/durashare-py"
Issues = "https://github.com/GRIFORTIS/durashare-py/issues"
Changelog = "https://github.com/GRIFORTIS/durashare-py/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["durashare_py*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--verbose --cov=durashare_py --cov-report=term-missing --cov-fail-under=90"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
# CI checks the spec out at ./durashare. That directory is not this package.
extend-exclude = "(^|/)durashare(/|$)"

[tool.ruff]
line-length = 100
target-version = "py310"
# CI checks the spec out at ./durashare. That tree is not this package.
extend-exclude = ["durashare"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.isort]
profile = "black"
line_length = 100

