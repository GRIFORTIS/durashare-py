name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write  # Required for trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Preflight tag/version alignment
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          echo "Release tag: ${TAG_NAME}"
          echo "Checked out SHA: $(git rev-parse HEAD)"
          python - <<'PY'
          import ast
          import os
          import re
          import sys
          from pathlib import Path
          import tomllib
          
          tag = os.environ["TAG_NAME"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid release tag format: {tag!r} (expected vX.Y.Z)")
          
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = pyproject.get("project", {}).get("version")
          if not isinstance(version, str) or not version:
              raise SystemExit("pyproject.toml missing [project].version")
          
          expected_tag = f"v{version}"
          if tag != expected_tag:
              raise SystemExit(
                  f"Tag/version mismatch: tag={tag!r} but pyproject.toml version={version!r}"
              )

          init_path = Path("schiavinato_sharing/__init__.py")
          tree = ast.parse(init_path.read_text(encoding="utf-8"), filename=str(init_path))
          init_version = None
          for node in tree.body:
              if isinstance(node, ast.Assign) and len(node.targets) == 1:
                  target = node.targets[0]
                  if isinstance(target, ast.Name) and target.id == "__version__":
                      if isinstance(node.value, ast.Constant) and isinstance(node.value.value, str):
                          init_version = node.value.value
                          break
          if init_version != version:
              raise SystemExit(
                  f"__version__ mismatch: schiavinato_sharing/__init__.py has {init_version!r} "
                  f"but pyproject.toml version={version!r}"
              )

          print(f"OK: tag={tag} version={version} __version__={init_version}")
          PY

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build twine

      - name: Run full test suite
        run: |
          mypy schiavinato_sharing
          ruff check .
          black --check .
          pytest --cov=schiavinato_sharing

      - name: Build package
        run: python -m build

      - name: Verify package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pypi-package
          path: dist/
          retention-days: 30

